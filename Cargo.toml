[package]
name = "deplograph"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# 设置的落盘位置：$XDG_CONFIG_HOME/<app id>/settings.json
dirs = "7"
# Default features bring in `gpui_kit::component` and the default icon set.
gpui-kit = "0.9"
# 把 assets/ 目录编译进二进制，运行时不再依赖文件系统
rust-embed = "8"
rust-i18n = "4.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
