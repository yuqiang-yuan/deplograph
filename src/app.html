<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri + SvelteKit + Typescript App</title>
    <script>
      // Runs before the app (and before its css) paints: put the saved
      // flyonui theme on <html> so the first frame is already correct.
      // "system" deliberately sets nothing — flyonui's `--prefersdark`
      // theme then follows the OS through prefers-color-scheme.
      // Keep the key and the values in sync with src/lib/theme.svelte.ts.
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      } catch {
        // storage unavailable — stay on flyonui's default theme
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
